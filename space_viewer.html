<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:system-ui,'Malgun Gothic',sans-serif;color:#17233b}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #dbe3ef;border-radius:9px;padding:9px 13px;background:white;color:#334155}button.active{background:#17233b;color:white;border-color:#17233b}.shell{border:1px solid #dbe3ef;border-radius:16px;overflow:hidden;background:white}.toolbar{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#64748b}.title{font-size:19px;font-weight:750;margin:4px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.stage{height:440px;position:relative;background:#eaf0f7}canvas{display:block;width:100%;height:100%}#three{position:absolute;inset:0;display:none}#three canvas{touch-action:none}.tag{position:absolute;top:14px;left:14px;background:#ffffffed;border:1px solid #dbe3ef;padding:9px 12px;border-radius:9px;font-size:11px;pointer-events:none}.legend{padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px}.dot{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:5px}.controls{padding:12px 16px;border-top:1px solid #edf1f7;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.stat{background:white;border:1px solid #dbe3ef;padding:14px;border-radius:12px;font-size:11px;color:#64748b}.stat strong{display:block;color:#17233b;font-size:23px;margin-top:5px}.note{font-size:11px;color:#64748b;line-height:1.7;padding:10px 2px}#detail{padding:0 16px 12px;font-size:12px;color:#475569}input{accent-color:#2563eb;max-width:120px}@media(max-width:550px){.stage{height:360px}.title{font-size:16px}.stats{gap:5px}.stat{padding:9px}.stat strong{font-size:19px}}
</style><div class="shell"><div class="toolbar"><div><div class="brand">EVENT ON / SPACE STUDIO</div><div class="title" id="title"></div></div><div class="actions"><button id="b2" class="active">평면 설계도</button><button id="b3">3D 공간</button><button id="heat">체류 분포</button></div></div><div class="stage"><canvas id="plan"></canvas><div id="three"></div><div class="tag" id="hint">시설 클릭: 상세 정보 · 그리드 5 m</div></div><div class="legend" id="legend"></div><div id="detail">시설을 선택하면 크기와 위치를 확인할 수 있습니다.</div><div class="controls"><button id="play">일시정지</button><button id="reset">처음부터</button><label>이동 배속 <input id="speed" type="range" min="0.5" max="4" step="0.5" value="1"></label><label>표시 인원 <select id="count"><option>30</option><option selected>60</option><option>100</option></select></label><span id="status"></span></div></div><div class="stats"><div class="stat">입력 총 방문객<strong id="total"></strong></div><div class="stat">현재 표시 인원<strong id="shown"></strong></div><div class="stat">접근 경로 연결<strong id="routes"></strong></div></div><div class="note" id="note"></div>
<script>
const D=__PAYLOAD__, $=id=>document.getElementById(id),canvas=$('plan'),ctx=canvas.getContext('2d');
$('title').textContent=D.name;$('total').textContent=D.visitors.toLocaleString()+'명';$('note').textContent='기획용 가상 시뮬레이션입니다. 표시 인원은 총 방문객·실시간 체류 인원 추정치가 아닙니다. 시설 크기와 이동 속도는 가정값이며 실측 자료로 교체해야 합니다. 체류 분포는 화면 내 에이전트의 누적 위치 빈도로, 실제 밀도·안전 판정이 아닙니다. '+D.warnings.join(' ');
D.zones.forEach(z=>{let item=document.createElement('span'),dot=document.createElement('i');dot.className='dot';dot.style.background=z.color;item.appendChild(dot);item.appendChild(document.createTextNode(z.name));$('legend').appendChild(item)});
const cell=1,cols=Math.ceil(D.width),rows=Math.ceil(D.depth),index=(x,y)=>y*cols+x;let free=new Uint8Array(cols*rows);
function inside(x,y){let b=false;for(let i=0,j=D.polygon.length-1;i<D.polygon.length;j=i++){let [a,c]=D.polygon[i],[d,e]=D.polygon[j];if((c>y)!=(e>y)&&x<(d-a)*(y-c)/(e-c)+a)b=!b}return b}
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let px=x+.5,py=y+.5;free[index(x,y)]=inside(px,py)&&!D.zones.some(z=>Math.abs(px-z.x)<z.w/2+.7&&Math.abs(py-z.y)<z.h/2+.7)?1:0}
function nearest(p){let best=-1,dist=Infinity;for(let i=0;i<free.length;i++)if(free[i]){let d=(i%cols+.5-p.x)**2+(Math.floor(i/cols)+.5-p.y)**2;if(d<dist){best=i;dist=d}}return best}
const entrance=nearest(D.gates[0]),exit=nearest(D.gates[1]);
// Flood-fill/BFS uses four neighbours: no diagonal corner-cutting or lines through booths.
function tree(start){let prev=new Int32Array(free.length).fill(-1);if(start<0)return prev;let queue=[start];prev[start]=start;for(let q=0;q<queue.length;q++){let a=queue[q],x=a%cols,y=Math.floor(a/cols);for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows)continue;let n=index(nx,ny);if(free[n]&&prev[n]===-1){prev[n]=a;queue.push(n)}}}return prev}
const entranceTree=tree(entrance);D.zones.forEach(z=>{z.node=nearest({x:z.x,y:z.y-z.h/2-1.4});z.reachable=z.node>=0&&entranceTree[z.node]>=0});
const reachable=D.zones.filter(z=>z.reachable);$('routes').textContent=reachable.length+'/'+D.zones.length;
function path(a,b){let prev=tree(a);if(b<0||prev[b]<0)return [];let arr=[b];while(arr[arr.length-1]!==a)arr.push(prev[arr[arr.length-1]]);return arr.reverse().map(i=>({x:i%cols+.5,y:Math.floor(i/cols)+.5,node:i}))}
let agents=[],running=true,heat=false,mode='2d',selected=null,visits=new Float32Array(free.length),clock=0,last=0,view;
function choose(){return reachable[Math.floor(Math.random()*reachable.length)]}
function setTrip(a,z){let p=path(nearest(a),z.node);a.path=p;a.i=0;a.target=z;a.dwell=0;if(!p.length)a.dwell=5}
function spawn(delay=0){if(entrance<0||!reachable.length)return null;let a={x:entrance%cols+.5,y:Math.floor(entrance/cols)+.5,wait:delay,dwell:0,trips:0,speed:.9+Math.random()*.5,leaving:false};setTrip(a,choose());return a}
function reset(){visits.fill(0);agents=Array.from({length:Number($('count').value)},(_,i)=>spawn(i*.35)).filter(Boolean);clock=0;if(scene)people()}
function step(dt){if(!running)return;dt*=Number($('speed').value);clock+=dt;for(let a of agents){if(a.wait>0){a.wait-=dt;continue}let ix=nearestFast(a);if(ix>=0)visits[ix]+=dt;if(a.dwell>0){a.dwell-=dt;if(a.dwell<=0){a.trips++;if(a.trips>=3&&exit>=0){a.path=path(nearest(a),exit);a.i=0;a.leaving=true}else setTrip(a,choose())}continue}let budget=a.speed*dt;while(budget>0&&a.i<a.path.length){let p=a.path[a.i],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);if(d<=budget){a.x=p.x;a.y=p.y;a.i++;budget-=d}else{a.x+=dx/d*budget;a.y+=dy/d*budget;budget=0}}if(a.i>=a.path.length){if(a.leaving){Object.assign(a,spawn(1)||a)}else a.dwell=10+Math.random()*25}}}
function nearestFast(a){let x=Math.floor(a.x),y=Math.floor(a.y);return x>=0&&x<cols&&y>=0&&y<rows?index(x,y):-1}
function frame(){let r=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(r.width*dpr)||canvas.height!==Math.round(r.height*dpr)){canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);let s=Math.min((r.width-70)/D.width,(r.height-60)/D.depth),ox=(r.width-D.width*s)/2,oy=(r.height-D.depth*s)/2;view={s,ox,oy};const X=x=>ox+x*s,Y=y=>r.height-oy-y*s;function outline(){ctx.beginPath();D.polygon.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath()}outline();ctx.fillStyle='#f8fafc';ctx.fill();ctx.save();ctx.clip();ctx.lineWidth=.6;ctx.strokeStyle='#dce4ef';for(let x=0;x<=D.width;x+=5){ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(D.depth));ctx.stroke()}for(let y=0;y<=D.depth;y+=5){ctx.beginPath();ctx.moveTo(X(0),Y(y));ctx.lineTo(X(D.width),Y(y));ctx.stroke()}
if(heat){let max=Math.max(1,...visits);for(let i=0;i<visits.length;i++)if(visits[i]>0){ctx.fillStyle=`rgba(239,68,68,${Math.min(.75,visits[i]/max)})`;ctx.fillRect(X(i%cols),Y(Math.floor(i/cols)+1),s,s)}}
if(selected&&selected.reachable){let p=path(entrance,selected.node);ctx.beginPath();p.forEach((p,i)=>i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([])}
for(let z of D.zones){let x=X(z.x-z.w/2),y=Y(z.y+z.h/2);ctx.fillStyle=z.color+'36';ctx.fillRect(x,y,z.w*s,z.h*s);ctx.strokeStyle=selected===z?'#17233b':z.color;ctx.lineWidth=selected===z?2.5:1.3;ctx.strokeRect(x,y,z.w*s,z.h*s);ctx.fillStyle='#17233b';ctx.textAlign='center';ctx.font='600 '+Math.min(12,Math.max(9,s*1.5))+'px system-ui';ctx.fillText(z.name,X(z.x),Y(z.y)-1);ctx.font='9px system-ui';ctx.fillStyle='#64748b';ctx.fillText(z.w+' × '+z.h+' m',X(z.x),Y(z.y)+12)}
for(let a of agents)if(a.wait<=0){ctx.beginPath();ctx.arc(X(a.x),Y(a.y),2.3,0,Math.PI*2);ctx.fillStyle=a.dwell>0?'#f97316':'#2563eb';ctx.fill()}ctx.restore();outline();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;ctx.stroke();for(let g of D.gates){ctx.beginPath();ctx.arc(X(g.x),Y(g.y),5,0,Math.PI*2);ctx.fillStyle=g.color;ctx.fill();ctx.fillStyle='#334155';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(g.name,X(g.x),Y(g.y)+17)}ctx.textAlign='left';ctx.fillStyle='#64748b';ctx.fillText('N ↑',14,25);ctx.fillText('10 m',14,r.height-15);ctx.fillRect(14,r.height-10,10*s,2)}
canvas.onclick=e=>{if(!view)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-view.ox)/view.s,y=(r.height-view.oy-(e.clientY-r.top))/view.s;selected=D.zones.find(z=>Math.abs(x-z.x)<=z.w/2&&Math.abs(y-z.y)<=z.h/2)||null;$('detail').textContent=selected?selected.name+' · '+selected.w+' × '+selected.h+' m · 중심 ('+selected.x.toFixed(1)+', '+selected.y.toFixed(1)+') m · '+(selected.reachable?'입구에서 접근 가능':'접근 경로 없음: 배치 수정 필요'):'시설을 선택하면 크기와 위치를 확인할 수 있습니다.'};
let renderer,scene,camera,meshes=[],labels=[],yaw=.65,pitch=.8,zoom=1,target={x:0,z:0};
function box(w,h,d,color,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function people(){meshes.forEach(m=>{scene.remove(m);m.geometry.dispose();m.material.dispose()});meshes=agents.map(()=>{let m=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1.5,6),new THREE.MeshStandardMaterial({color:'#2563eb'}));scene.add(m);return m})}
function label(text,x,y,z){let c=document.createElement('canvas');c.width=512;c.height=96;let g=c.getContext('2d');g.fillStyle='#fffffff0';g.fillRect(0,0,512,96);g.fillStyle='#17233b';g.font='bold 38px sans-serif';g.textAlign='center';g.fillText(text,256,62);let m=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));m.scale.set(10,1.875,1);m.position.set(x,y,z);scene.add(m)}
function init3(){renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));$('three').appendChild(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color('#eaf0f7');camera=new THREE.PerspectiveCamera(40,1,.1,2000);scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,1.4));let light=new THREE.DirectionalLight(0xffffff,1.5);light.position.set(30,70,20);scene.add(light);
// XY geometry mapped to world (x, height, -y), never mirrored between 2D and 3D.
let sh=new THREE.Shape();D.polygon.forEach((p,i)=>i?sh.lineTo(p[0]-D.width/2,p[1]-D.depth/2):sh.moveTo(p[0]-D.width/2,p[1]-D.depth/2));sh.closePath();let floor=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshStandardMaterial({color:'#f8fafc',side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;scene.add(floor);let pts=D.polygon.concat([D.polygon[0]]).map(p=>new THREE.Vector3(p[0]-D.width/2,.05,D.depth/2-p[1]));scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:'#64748b'})));
for(let z of D.zones){let x=z.x-D.width/2,v=D.depth/2-z.y;box(z.w,.25,z.h,z.color,x,.13,v);if(z.name==='공연장'){box(z.w,1.2,z.h,'#334155',x,.65,v);box(z.w,3,.3,z.color,x,2,v-z.h/2)}else{box(z.w,2.5,.15,'#e2e8f0',x,1.4,v-z.h/2);for(let dx of [-1,1])for(let dz of [-1,1])box(.15,2.8,.15,'#94a3b8',x+dx*z.w*.47,1.4,v+dz*z.h*.47);let roof=box(z.w, .18,z.h,z.color,x,2.9,v);roof.material.transparent=true;roof.material.opacity=.7}label(z.name,x,5,v)}for(let g of D.gates){let x=g.x-D.width/2,v=D.depth/2-g.y;box(2,.4,1,g.color,x,.2,v);label(g.name,x,3,v)}if(D.shape==='돔형 (지붕 있음)'){let roof=new THREE.Mesh(new THREE.SphereGeometry(D.width/2,32,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshBasicMaterial({color:'#94a3b8',wireframe:true,transparent:true,opacity:.15}));roof.scale.y=.5;scene.add(roof)}people();let drag=false,px,py;renderer.domElement.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-px)*.008;pitch=Math.max(.25,Math.min(1.4,pitch+(e.clientY-py)*.008));px=e.clientX;py=e.clientY};renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*(e.deltaY<0?1.08:.92)))},{passive:false})}
function draw3(){let e=$('three'),w=e.clientWidth,h=e.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;let distance=Math.max(D.width,D.depth)*1.75/zoom;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(0,0,0);camera.updateProjectionMatrix();agents.forEach((a,i)=>{let m=meshes[i];if(m){m.visible=a.wait<=0;m.position.set(a.x-D.width/2,.9,D.depth/2-a.y)}});renderer.render(scene,camera)}
function switchMode(m){mode=m;canvas.style.display=m==='2d'?'block':'none';$('three').style.display=m==='3d'?'block':'none';$('b2').classList.toggle('active',m==='2d');$('b3').classList.toggle('active',m==='3d');$('hint').textContent=m==='2d'?'시설 클릭: 상세 정보 · 그리드 5 m':'드래그: 회전 · 휠: 확대/축소 · 치수는 입력값 기준'}
$('b2').onclick=()=>switchMode('2d');$('b3').onclick=()=>{if(renderer)return switchMode('3d');if(!window.THREE){$('detail').textContent='3D 라이브러리를 불러오지 못했습니다. 인터넷/CDN 접속을 확인하세요. 2D는 계속 사용할 수 있습니다.';return}try{init3();switchMode('3d')}catch(e){$('detail').textContent='이 브라우저에서 3D 화면을 초기화하지 못했습니다. 2D를 이용해 주세요.';switchMode('2d')}};$('play').onclick=()=>{running=!running;$('play').textContent=running?'일시정지':'계속 재생'};$('reset').onclick=reset;$('count').onchange=reset;$('heat').onclick=()=>{heat=!heat;$('heat').classList.toggle('active',heat);switchMode('2d')};reset();function loop(t){let dt=Math.min(.08,last?(t-last)/1000:0);last=t;step(dt);if(mode==='2d')frame();else draw3();$('shown').textContent=agents.filter(a=>a.wait<=0).length+'명';$('status').textContent='가상 경과 '+Math.floor(clock)+'초';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></html>
